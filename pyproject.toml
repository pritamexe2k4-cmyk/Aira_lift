[project]
name = "aira-lift"
version = "0.1.0"
description = "Aira Lift — personal gym tracker + MCP + phone web UI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.0",
  "mcp>=1.0,<2",
  "tzdata>=2024.1",
  "httpx>=0.27.0",
  "authlib>=1.3.0",
  "itsdangerous>=2.1.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
aira-lift-api = "aira_lift.api:main"
aira-lift-mcp = "aira_lift.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aira_lift = ["static/*"]
